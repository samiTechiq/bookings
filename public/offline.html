<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0284c7">
    <title>Offline · NATU Bookings</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f0f9ff;
            color: #0c4a6e;
            text-align: center;
        }
        main { max-width: 360px; }
        img { width: 88px; height: 88px; margin-bottom: 20px; }
        h1 { font-size: 1.35rem; margin: 0 0 8px; }
        p { margin: 0 0 24px; line-height: 1.5; color: #075985; }
        button {
            appearance: none;
            border: 0;
            border-radius: 10px;
            padding: 12px 22px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: #0284c7;
            cursor: pointer;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0b1220; color: #e0f2fe; }
            p { color: #bae6fd; }
        }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>NATU Bookings needs an internet connection to load live bookings and supplies. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
